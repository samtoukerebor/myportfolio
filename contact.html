<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Samtou Kerebor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Samtou Kerebor</a>
      <nav class="nav">
        <a href="about.html">À propos</a>
        <a href="projects.html">Projets</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Contact</p>
        <h1>Entrer en relation</h1>
        <p class="page-intro">
          Pour me contacter rapidement, utilise le bouton ci-dessous : il ouvrira ta messagerie avec un message pré-rempli.
        </p>
      </div>
    </section>

    <section class="section">
      <div class="container contact-grid">
        <div class="card">
          <h3>Coordonnées</h3>
          <p><strong>Email :</strong> kerebors@gmail.com</p>
          <p><strong>LinkedIn :</strong> <a href="https://www.linkedin.com/in/samtoukerebor" target="_blank" rel="noreferrer">samtoukerebor</a></p>
          <p><strong>Portfolio :</strong> <a href="https://samtoukerebor.github.io/myportfolio/" target="_blank" rel="noreferrer">myportfolio</a></p>
        </div>

        <div class="card contact-card">
          <h3>Message rapide</h3>
          <div class="contact-form">
            <div>
              <label for="subject">Sujet</label>
              <input id="subject" type="text" value="Contact via le portfolio" />
            </div>

            <div>
              <label for="message">Message</label>
              <textarea id="message" rows="6">Bonjour Samtou,

Je souhaite échanger avec toi au sujet de ton portfolio.</textarea>
            </div>

            <button class="btn btn-primary btn-full" id="mailtoBtn" type="button">Ouvrir ma boîte mail</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const mailtoBtn = document.getElementById("mailtoBtn");
    const subjectInput = document.getElementById("subject");
    const messageInput = document.getElementById("message");
    const recipient = "kerebors@gmail.com";

    mailtoBtn.addEventListener("click", () => {
      const subject = encodeURIComponent(subjectInput.value);
      const body = encodeURIComponent(messageInput.value);
      window.location.href = `mailto:${recipient}?subject=${subject}&body=${body}`;
    });
  </script>
</body>
</html>
